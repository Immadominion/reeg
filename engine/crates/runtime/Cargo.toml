[package]
name = "reeg-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# OCI container tier (Linux only): requires runc on PATH and a Linux rootfs directory.
oci = []
# Firecracker microVM tier (Linux only): requires /dev/kvm and the firecracker binary. Pulls the
# `tar` crate for safe in-process extraction of the guest's /work archive.
firecracker = ["dep:tar"]

[dependencies]
blake3 = "1.8.5"
hex = "0.4.3"
libc = "0.2"
reeg-snapshot = { path = "../snapshot" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
# Safe in-process extraction of the guest's /work tar (no `tar -x` shell-out, which a malicious
# guest could exploit via symlink/.. traversal). Only compiled in for the firecracker tier.
tar = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
