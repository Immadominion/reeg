name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  rust:
    name: Rust engine (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --manifest-path engine/Cargo.toml --check
      - run: cargo clippy --manifest-path engine/Cargo.toml --workspace -- -D warnings
      - run: cargo test --manifest-path engine/Cargo.toml --workspace

  move:
    name: Move package (build, test)
    runs-on: ubuntu-latest
    env:
      # Pin the Sui CLI to a known release. Bump deliberately when the Move toolchain advances.
      SUI_VERSION: testnet-v1.73.1
    steps:
      - uses: actions/checkout@v5
      # Install the Sui CLI from a pinned release binary (no suiup curl-pipe, which is rate-limited
      # without a token and frequently leaves `sui` off PATH).
      - name: Install Sui CLI
        run: |
          url="https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          curl -fsSL -o sui.tgz "$url"
          mkdir -p sui-bin && tar -xzf sui.tgz -C sui-bin
          sudo install -m0755 "$(find sui-bin -maxdepth 2 -name sui -type f | head -1)" /usr/local/bin/sui
          sui --version
      - run: sui move build --path move
      - run: sui move test --path move
